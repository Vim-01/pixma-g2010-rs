[workspace]
members = [
    "crates/pixma-core",
    "crates/pixma-transport",
    "crates/pixma-protocol",
    "crates/pixma-color",
    "crates/pixma-raster",
    "crates/pixma-imageproc",
    "crates/pixma-daemon",
    "crates/pixma-cups",
    "crates/pixma-printer-app",
    "crates/pixma-sane",
    "crates/pixma-escl",
    "crates/pixma-cli",
    "crates/pixma-gui",
]
resolver = "2"

[workspace.package]
version = "0.2.2"
edition = "2021"
rust-version = "1.78"
authors = ["Vim-01"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/Vim-01/pixma-g2010-rs"

[workspace.dependencies]
# Async Runtime & Networking
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["tokio", "http1", "http2"] }
futures = "0.3"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# USB & Linux OS
nusb = "0.1"
nix = { version = "0.29", features = ["fs", "poll", "signal", "ioctl"] }

# Serialization & IPC
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.36", features = ["serialize"] }
ciborium = "0.2"

# Image Processing & Color
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "webp"] }
imageproc = "0.24"
rustfft = "6.2"
qcms = "0.3"
rayon = "1.10"
pdf-writer = "0.11"

# CLI & Logging
clap = { version = "4.5", features = ["derive", "cargo"] }
clap_complete = "4.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"

# Local crates
pixma-core = { path = "crates/pixma-core" }
pixma-transport = { path = "crates/pixma-transport" }
pixma-protocol = { path = "crates/pixma-protocol" }
pixma-color = { path = "crates/pixma-color" }
pixma-raster = { path = "crates/pixma-raster" }
pixma-imageproc = { path = "crates/pixma-imageproc" }
pixma-daemon = { path = "crates/pixma-daemon" }
pixma-cups = { path = "crates/pixma-cups" }
pixma-printer-app = { path = "crates/pixma-printer-app" }
pixma-sane = { path = "crates/pixma-sane" }
pixma-escl = { path = "crates/pixma-escl" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true
